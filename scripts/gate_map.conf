# gate_map.conf — the mapping table of "changed files → acceptance directories" for the gate directory lane (contracts/baseline-formats.md)
# Rule format: `glob -> ALL | dir-id[,dir-id…]` (zsh glob semantics; **note**: `X/**/Y` in [[ == ]] matching does not hit zero-level — one-level needs a separate `X/*` row; `#` comments; empty right side = fast lane is enough)
# First match wins; **files not matched by any rule = ALL** (fail-safe, enforced in gate.sh);
# lib/ as a whole is the engine core — pollutes all directories, uniformly ALL.
# As Z/X phases incorporate zend-*/ext-* directories, refine domain rows here one by one (accompanying commits).

lib/**/*          -> ALL  # engine core (lexer/parser/eval/interp/ini/curl_fns… all of it)
mix.exs           -> ALL
mix.lock          -> ALL
src/**/*          -> ALL
c_src/**/*        -> ALL
test/*            ->      # test changes are covered by the fast lane
test/**/*         ->
scripts/*         ->      # scripts/docs/specs don't touch semantics
scripts/**/*      ->
docs/*            ->
docs/**/*         ->
specs/*           ->
specs/**/*        ->
*.md              ->
.gitignore        ->
